[project]
name = "sanushi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mayur Garg", email = "mayur7garg@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ipython>=9.17.1",
    "numpy>=2.5.4",
    "polars>=2.0.0",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "google-genai>=2.31.0",
    "marimo>=0.25.1",
    "pydantic-ai-slim>=2.57.0",
]
